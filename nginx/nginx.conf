# Drill 24: the load balancer in front of the scaled `api` service, under `--profile replicas`.
# See plans/2026-10-12_drill-24-three-replicas.md.

worker_processes auto;

events {
  # 2,000 concurrent clients through a proxy hold 4,000 connections: one in, one upstream.
  worker_connections 4096;
}

http {
  # Docker's DNS. `valid=1s` re-reads `api`, so replicas that join or leave are followed.
  resolver 127.0.0.11 valid=1s ipv6=off;

  # $msec first: epoch seconds with milliseconds, so `pnpm replicas blip` can line requests up with a kill.
  log_format upstream '$msec $status $request_method $uri '
                      'upstream=$upstream_addr upstream_status=$upstream_status '
                      'rt=$request_time urt=$upstream_response_time';
  access_log /dev/stdout upstream;
  error_log /dev/stderr warn;

  upstream api {
    # `resolve` (open source since 1.27.3) needs the group in shared memory. One name, one peer per A record.
    zone api 64k;
    server api:3002 resolve max_fails=1 fail_timeout=10s;
    keepalive 64;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 1s;
      # nginx's default, written out: a failed connect is retried on another peer for any method,
      # and a request already sent is retried only if it is idempotent.
      proxy_next_upstream error timeout;
      add_header x-served-by $upstream_addr always;
    }
  }
}
