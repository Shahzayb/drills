; Drill 22's stretch: transaction pooling in front of postgres_db, under `profiles: ['pgbouncer']`.
; See plans/2026-10-06_drill-22-connection-pool-knee.md.

[databases]
* = host=postgres_db port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
; Written at start from .env by the compose command; passwords never live in this file.
auth_type = scram-sha-256
auth_file = /tmp/userlist.txt
admin_users = postgres

pool_mode = transaction
; Server connections per user/database pair: the knee, so clients can oversize their own pools.
default_pool_size = 32
max_client_conn = 1000
; 0 first, so the probe sees the pre-1.21 failure; it raises this over the admin console.
max_prepared_statements = 0

ignore_startup_parameters = extra_float_digits,options
