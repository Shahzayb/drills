# Drill 23: the load balancer in front of api_a and api_b, under `--profile drain`.
# See plans/2026-10-11_drill-23-graceful-shutdown.md.

global
  log stdout format raw local0 info

# Docker's DNS, re-read every second, so a restarted replica is found at its new address.
resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 1s

defaults
  mode http
  log global
  option httplog
  # Logs only abnormal sessions. Their termination state (SC, SH, SD...) says who closed what.
  option dontlog-normal
  timeout connect 2s
  timeout client 30s
  timeout server 30s
  # No re-send of any request, so every app-side failure reaches the client and gets counted.
  retries 0

frontend public
  bind :8080
  default_backend api

backend api
  balance roundrobin
  # Readiness. 503 while draining takes the server out within inter x fall.
  option httpchk GET /health
  http-check expect status 200
  default-server check inter 1s fall 2 rise 2 resolvers docker init-addr none
  http-response set-header x-served-by %[srv_name]
  server a api_a:3002
  server b api_b:3002

frontend stats
  bind :8404
  stats enable
  stats uri /stats
  stats refresh 1s
