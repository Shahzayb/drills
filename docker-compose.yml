# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  postgres_db:
    image: postgres:18-alpine
    container_name: drills_postgres
    env_file: .env
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - wal_level=minimal
      - -c
      - max_wal_senders=0
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_timeout=30min
      - -c
      - shared_preload_libraries=${PG_PRELOAD:-}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - drills_pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - app-network
    mem_limit: 3g
    mem_reservation: 2g

  redis_cache:
    image: redis:8-alpine
    container_name: drills_redis
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD:-default_secure_pass}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - drills_redisdata:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -a ${REDIS_PASSWORD:-default_secure_pass} ping | grep PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - app-network
    mem_limit: 512m
    mem_reservation: 256m

  nest_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drills_backend
    env_file: .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-}
      - LIST_STRATEGY=${LIST_STRATEGY:-}
      - KEYSET_TIEBREAK=${KEYSET_TIEBREAK:-}
      - SEARCH_STRATEGY=${SEARCH_STRATEGY:-}
      - QUERY_COUNTER=${QUERY_COUNTER:-}
    ports:
      - '${BACKEND_PORT:-3002}:3002'
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./packages:/app/packages
      - /app/node_modules
    command: sh -c "cd /app && pnpm --filter=backend dev"
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://localhost:3002/health >/dev/null || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 40s
    restart: always
    networks:
      - app-network
    mem_limit: 1g
    mem_reservation: 512m

  next_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drills_frontend
    env_file: .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-}
    ports:
      - '${FRONTEND_PORT:-3001}:3001'
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - ./packages:/app/packages
      - /app/node_modules
    command: sh -c "cd /app && pnpm --filter=frontend dev"
    depends_on:
      nest_server:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://localhost:3001/health >/dev/null || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 40s
    restart: always
    networks:
      - app-network
    mem_limit: 1g
    mem_reservation: 512m
  k6:
    image: grafana/k6:2.1.0
    container_name: drills_k6
    volumes:
      - ./k6:/scripts
    networks:
      - app-network
    profiles: ['test']
    entrypoint: ['k6']

  otel_collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    container_name: drills_otel_collector
    volumes:
      - ./otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - '${OTEL_HTTP_PORT:-4318}:4318'
    depends_on:
      - jaeger
    networks:
      - app-network
    profiles: ['trace']
    mem_limit: 512m

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: drills_jaeger
    ports:
      - '${JAEGER_UI_PORT:-16686}:16686'
    networks:
      - app-network
    profiles: ['trace']
    mem_limit: 1g

networks:
  app-network:
    driver: bridge

volumes:
  drills_pgdata:
  drills_redisdata:
